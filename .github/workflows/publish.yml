name: Verify, typeset and publish
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test the pinned Sui Move package
        run: |
          curl --fail --location --retry 3 https://github.com/MystenLabs/sui/releases/download/mainnet-v1.80.1/sui-mainnet-v1.80.1-ubuntu-x86_64.tgz -o /tmp/sui.tgz
          echo '97f9aed10e0c2fe3204ce4639ac992e1449b17c14f22f30e9f903ead54ac7336  /tmp/sui.tgz' | sha256sum --check
          mkdir -p /tmp/sui-cli
          sui_member="$(tar -tzf /tmp/sui.tgz | awk -F / '$NF == "sui" { print; exit }')"
          test -n "$sui_member"
          tar -xzf /tmp/sui.tgz -C /tmp/sui-cli "$sui_member"
          sui_binary="/tmp/sui-cli/$sui_member"
          chmod +x "$sui_binary"
          "$sui_binary" move test --path viper --build-env testnet
  localnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install checksum-verified pinned Sui CLI
        run: |
          curl --fail --location --retry 3 https://github.com/MystenLabs/sui/releases/download/mainnet-v1.80.1/sui-mainnet-v1.80.1-ubuntu-x86_64.tgz -o /tmp/sui.tgz
          echo '97f9aed10e0c2fe3204ce4639ac992e1449b17c14f22f30e9f903ead54ac7336  /tmp/sui.tgz' | sha256sum --check
          mkdir -p /tmp/sui-cli
          sui_member="$(tar -tzf /tmp/sui.tgz | awk -F / '$NF == "sui" { print; exit }')"
          test -n "$sui_member"
          tar -xzf /tmp/sui.tgz -C /tmp/sui-cli "$sui_member"
          chmod +x "/tmp/sui-cli/$sui_member"
          echo "SUI_BIN=/tmp/sui-cli/$sui_member" >> "$GITHUB_ENV"
      - run: npm run test:rehearsal
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: localnet-rehearsal
          path: tmp/localnet-rehearsal.json
          if-no-files-found: error
  whitepaper:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the generated source is current
        run: |
          cp docs/Viper_Coin_Whitepaper.tex /tmp/whitepaper.tex
          python3 scripts/generate_whitepaper.py
          cmp /tmp/whitepaper.tex docs/Viper_Coin_Whitepaper.tex
      - name: Typeset the journal PDF
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          working_directory: docs
          root_file: Viper_Coin_Whitepaper.tex
          texlive_version: 2026
      - name: Verify actual PDF supply text and metadata
        run: |
          python3 -m pip install pypdf==6.10.0
          python3 scripts/test_supply_pdf.py docs/Viper_Coin_Whitepaper.pdf
      - name: Record PDF provenance
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          Path('docs/whitepaper.provenance.json').write_text(json.dumps({'sourceSha256': digest('docs/Viper_Coin_Whitepaper.tex'), 'pdfSha256': digest('docs/Viper_Coin_Whitepaper.pdf')}) + '\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whitepaper-pdf
          path: |
            docs/Viper_Coin_Whitepaper.pdf
            docs/whitepaper.provenance.json
          if-no-files-found: error
  website:
    timeout-minutes: 15
    needs: [whitepaper, contracts, localnet]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: whitepaper-pdf
          path: tmp/whitepaper
      - name: Include the PDF in the website
        run: |
          cp tmp/whitepaper/Viper_Coin_Whitepaper.pdf public/whitepaper.pdf
          cp tmp/whitepaper/whitepaper.provenance.json public/whitepaper.provenance.json
      - run: npm run test:economics
      - run: npm run test:monitor
      - run: npm run test:site
      - run: npm run test:brand
      - run: npm run test:supply
      - run: npm run test:whitepaper
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE_PATH: /ViperCoin/
      - run: npm run test:deployment
      - name: Install pinned Chromium for contrast checks
        run: PLAYWRIGHT_BROWSERS_PATH=tmp/playwright-browsers npx playwright install --with-deps chromium
      - run: npm run test:contrast
      - name: Require the published PDF and provenance
        run: |
          test -s dist/whitepaper.pdf
          test -s dist/whitepaper.provenance.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: website
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
